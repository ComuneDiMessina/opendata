description:
  en:
    localisedName: Open Data Catalog
    shortDescription: React frontend for CKAN based
    longDescription: The Open Data portal of the City of Messina
      (dati.comune.messina.it) is an advanced platform for the management and
      sharing of public information assets, built upon a robust CKAN backend. To
      ensure a modern, highly responsive, and accessible user experience, the
      system integrates a custom frontend developed entirely in React. This
      modern architecture allows for seamless navigation, advanced dataset
      search, and clear resource visualization.  It fosters administrative
      transparency, civic innovation, and data reuse by citizens, developers,
      and businesses in full compliance with national guidelines
    features:
      - open data
      - api
